name: RustCraft Android APK

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: aarch64-linux-android

      - name: Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          pin() {
            python3 -c 'import json,sys; print(json.load(open("packaging/android/runtime.json"))[sys.argv[1]])' "$1"
          }
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-$(pin target_sdk)" \
            "build-tools;$(pin build_tools)" \
            "ndk;$(pin ndk)"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$(pin ndk)" >> "$GITHUB_ENV"

      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y librsvg2-bin cmake ninja-build gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          cargo install cargo-ndk --version 3.5.4 --locked

      - name: Build APK
        run: bash packaging/android/build-apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: RustCraft-Android
          path: target/android/*-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14
